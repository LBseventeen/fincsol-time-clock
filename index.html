<style>
  :root{
    --surface:#FFFFFF;
    --surface-muted:#F4F5F7;
    --ink:#10151D;
    --slate:#57626F;
    --slate-soft:#94A0AC;
    --accent:#1D5FA8;
    --accent-strong:#123F73;
    --accent-soft:#E7EFF8;
    --good:#3C8452;
    --good-soft:#E7F2E9;
    --danger:#AD4530;
    --danger-soft:#F5E9E5;
    --gold:#B08A3E;
    --gold-soft:#F5EEDD;
    --line:#E4E7EB;
    --glass: rgba(255,255,255,.9);
    --glass-strong: rgba(255,255,255,.97);
    --shadow: 0 1px 2px rgba(16,21,29,.04), 0 12px 28px -16px rgba(16,21,29,.18);
    --shadow-lg: 0 4px 10px rgba(16,21,29,.06), 0 24px 48px -20px rgba(16,21,29,.28);
    --radius: 16px;
    --sidebar-bg:#0C121C;
    --sidebar-line: rgba(255,255,255,.08);
    --sidebar-ink:#EEF1F5;
    --sidebar-muted:#8B97A6;
    --sidebar-active:#1D5FA8;
    --font-ui:'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --surface:#161B23; --surface-muted:#1C222B;
      --ink:#EDF0F4; --slate:#9AA6B2; --slate-soft:#616D7A;
      --accent:#6FA9E0; --accent-strong:#9AC4EC; --accent-soft:#1E2D3E;
      --good:#7FBE8E; --good-soft:#1E2E22;
      --danger:#E0917A; --danger-soft:#3A2822;
      --gold:#D8BC80; --gold-soft:#332C1B;
      --line:#2A313C;
      --glass: rgba(22,27,35,.9);
      --glass-strong: rgba(22,27,35,.97);
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 14px 30px -16px rgba(0,0,0,.55);
      --shadow-lg: 0 4px 12px rgba(0,0,0,.35), 0 26px 50px -18px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --surface:#161B23; --surface-muted:#1C222B;
    --ink:#EDF0F4; --slate:#9AA6B2; --slate-soft:#616D7A;
    --accent:#6FA9E0; --accent-strong:#9AC4EC; --accent-soft:#1E2D3E;
    --good:#7FBE8E; --good-soft:#1E2E22;
    --danger:#E0917A; --danger-soft:#3A2822;
    --gold:#D8BC80; --gold-soft:#332C1B;
    --line:#2A313C;
    --glass: rgba(22,27,35,.9);
    --glass-strong: rgba(22,27,35,.97);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 14px 30px -16px rgba(0,0,0,.55);
    --shadow-lg: 0 4px 12px rgba(0,0,0,.35), 0 26px 50px -18px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; font-family:var(--font-ui); color:var(--ink);
    background:var(--surface-muted);
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  button,input,select{font-family:inherit; color:inherit;}
  h1,h2,h3{margin:0; text-wrap:balance;}
  .mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }
  svg{display:block;}

  /* ---------- shell (admin) ---------- */
  #shell{display:flex; min-height:100vh;}
  #sidebar{
    width:252px; flex-shrink:0; background:var(--sidebar-bg); border-right:1px solid var(--sidebar-line);
    display:flex; flex-direction:column; padding:1.5rem 1.1rem;
  }
  .brand{padding:.2rem .1rem 1.7rem;}
  .brand-card{
    background:#FFFFFF; border:1px solid rgba(255,255,255,.12); border-radius:16px;
    padding:.85rem .9rem; box-shadow:var(--shadow-lg);
    display:flex; align-items:center; justify-content:center;
  }
  .brand-card img{width:100%; height:auto; display:block; max-width:196px;}

  .nav{display:flex; flex-direction:column; gap:.25rem; margin-top:.4rem;}
  .nav-item{
    display:flex; align-items:center; gap:.75rem; padding:.68rem .85rem; border-radius:11px;
    background:transparent; border:none; text-align:left; cursor:pointer;
    font-size:.9rem; font-weight:600; color:var(--sidebar-muted);
    transition:background .15s ease, color .15s ease;
  }
  .nav-item svg{flex-shrink:0;}
  .nav-item:hover{background:rgba(255,255,255,.06); color:var(--sidebar-ink);}
  .nav-item.active{background:var(--sidebar-active); color:#fff; box-shadow:0 6px 16px -6px rgba(29,95,168,.6);}

  .sidebar-footer{
    margin-top:auto; display:flex; align-items:center; gap:.65rem; padding:.75rem .7rem;
    border-radius:14px; background:rgba(255,255,255,.05); border:1px solid var(--sidebar-line);
  }
  .avatar{
    width:36px; height:36px; border-radius:50%; background:var(--sidebar-active); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.9rem; flex-shrink:0;
  }
  .sidebar-footer .who b{display:block; font-size:.86rem; font-weight:700; color:var(--sidebar-ink);}
  .sidebar-footer .who span{display:block; font-size:.74rem; color:var(--sidebar-muted);}

  /* ---------- main / sky (admin) ---------- */
  #main{
    flex:1; position:relative; overflow-x:hidden; min-height:100vh;
    background:
      radial-gradient(900px circle at 12% -8%, var(--accent-soft), transparent 60%),
      radial-gradient(700px circle at 100% 0%, var(--good-soft), transparent 55%),
      var(--surface-muted);
  }
  .topbar{
    display:flex; justify-content:flex-end; align-items:center; gap:.7rem;
    padding:1.4rem 1.6rem 0;
  }
  .icon-btn{
    width:42px; height:42px; border-radius:50%; border:none; cursor:pointer;
    background:var(--glass); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow);
  }
  .page-head{
    display:flex; justify-content:space-between; align-items:flex-start; gap:1.5rem; flex-wrap:wrap;
    padding:1.2rem 1.6rem 0;
  }
  .page-head h1{font-size:1.85rem; font-weight:800; letter-spacing:-.02em;}
  .accent-rule{width:40px; height:4px; border-radius:999px; background:var(--gold); margin:.6rem 0 .55rem;}
  .page-sub{color:var(--slate); font-size:.94rem; font-weight:500;}
  .page-body{padding:1.8rem 1.6rem 4rem; max-width:1180px;}

  /* ---------- dashboard tiles ---------- */
  .dashboard-section{margin-bottom:2.2rem;}
  .dashboard-section:last-child{margin-bottom:0;}
  .section-head{display:flex; align-items:center; gap:.55rem; margin-bottom:1rem; padding:0 .1rem; color:var(--ink);}
  .section-head h2{font-size:1.08rem; font-weight:800;}
  .section-count{
    background:var(--glass-strong); color:var(--accent-strong); font-size:.74rem; font-weight:700;
    padding:.15rem .6rem; border-radius:999px; border:1px solid var(--line);
  }
  .section-empty{
    color:var(--slate); font-size:.85rem; background:var(--glass); border:1px dashed var(--line);
    border-radius:14px; padding:.9rem 1rem;
  }
  .tile-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:1.1rem;}
  .tile{
    position:relative; background:var(--surface); border-radius:20px; box-shadow:var(--shadow);
    padding:1.3rem 1.2rem 1.1rem; cursor:pointer; border:1px solid transparent;
    transition:transform .12s ease, border-color .15s ease;
  }
  .tile:hover{transform:translateY(-2px); border-color:var(--accent-soft); box-shadow:var(--shadow-lg);}
  .tile:active{transform:translateY(0) scale(.98);}
  .tile-top{display:flex; justify-content:space-between; align-items:flex-start;}
  .tile-avatar{
    width:52px; height:52px; border-radius:50%; background:var(--accent-soft); color:var(--accent-strong);
    display:flex; align-items:center; justify-content:center;
  }
  .tile-name{font-size:1.15rem; font-weight:700; margin-top:.7rem;}
  .status-pill{
    display:inline-flex; align-items:center; gap:.4rem; margin-top:.55rem;
    font-size:.72rem; font-weight:700; letter-spacing:.03em; text-transform:uppercase;
    padding:.32rem .65rem; border-radius:999px; background:var(--accent-soft); color:var(--accent-strong);
  }
  .status-pill::before{content:''; width:6px; height:6px; border-radius:50%; background:currentColor;}
  .status-pill.in{background:var(--good-soft); color:var(--good);}
  .tile-meta{display:flex; align-items:center; gap:.4rem; font-size:.8rem; color:var(--slate); margin-top:.6rem;}

  .empty-state{
    max-width:440px; text-align:center; color:var(--slate); margin:3rem auto; padding:2rem;
    background:var(--glass-strong); border-radius:20px; display:flex; flex-direction:column; gap:.6rem; align-items:center;
  }

  /* ---------- overlays ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(15,36,56,.28); backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center; padding:1.5rem; z-index:50; overflow-y:auto;
  }
  .card-modal{
    background:var(--surface); border-radius:22px; box-shadow:var(--shadow); padding:2.2rem 2rem;
    width:100%; max-width:420px; text-align:center; display:flex; flex-direction:column; gap:1.1rem;
    max-height:90vh; overflow-y:auto;
  }
  .confirm-verb{color:var(--accent); font-size:.82rem; text-transform:uppercase; letter-spacing:.08em; font-weight:700;}
  .confirm-name{font-size:1.5rem; font-weight:800;}

  /* ---------- buttons / forms ---------- */
  .btn{
    border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:10px;
    padding:.68rem 1.1rem; font-size:.9rem; font-weight:700; cursor:pointer; transition:transform .1s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .btn:hover{border-color:var(--accent);}
  .btn:active{transform:scale(.98);}
  .btn:disabled{opacity:.6; cursor:default;}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 6px 16px -8px rgba(29,95,168,.55);}
  .btn-primary:hover{background:var(--accent-strong); border-color:var(--accent-strong);}
  .btn-ghost{background:transparent; border-color:transparent; color:var(--slate);}
  .btn-ghost:hover{color:var(--ink); background:var(--surface-muted);}
  .btn-danger{background:var(--danger-soft); border-color:var(--danger-soft); color:var(--danger);}
  .btn-block{width:100%;}
  .btn-sm{padding:.4rem .7rem; font-size:.8rem;}

  .field{display:flex; flex-direction:column; gap:.35rem; text-align:left;}
  .field label{font-size:.78rem; font-weight:700; color:var(--slate);}
  .field input, .field select{
    border:1px solid var(--line); border-radius:10px; padding:.65rem .8rem; background:var(--surface-muted);
    color:var(--ink); font-size:.92rem;
  }
  .field-error{color:var(--danger); font-size:.82rem; text-align:left; min-height:1em;}

  /* ---------- panels / pages ---------- */
  .panel{background:var(--surface); border-radius:20px; box-shadow:var(--shadow); padding:1.5rem; display:flex; flex-direction:column; gap:1.1rem;}
  .panel + .panel{margin-top:1.2rem;}
  .panel-head{display:flex; align-items:center; justify-content:space-between; gap:.8rem; flex-wrap:wrap;}
  .panel-head h2{font-size:1.05rem; font-weight:800;}

  .stat-row{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:1rem; margin-bottom:0;}
  .stat-tile{background:var(--surface); border-radius:18px; box-shadow:var(--shadow); padding:1.1rem 1.25rem;}
  .stat-tile .n{font-family:var(--font-mono); font-size:1.6rem; font-weight:700;}
  .stat-tile .l{color:var(--slate); font-size:.78rem; text-transform:uppercase; letter-spacing:.05em; font-weight:700; margin-top:.2rem;}

  .bar-row{display:flex; align-items:center; gap:.8rem;}
  .bar-row .name{width:120px; flex-shrink:0; font-size:.85rem; font-weight:700;}
  .bar-track{flex:1; height:10px; border-radius:999px; background:var(--surface-muted); overflow:hidden;}
  .bar-fill{height:100%; border-radius:999px; background:var(--accent);}
  .bar-row .hrs{width:70px; text-align:right; font-family:var(--font-mono); font-size:.82rem; color:var(--slate); flex-shrink:0;}

  .emp-row{display:flex; flex-direction:column; gap:.55rem; padding:.7rem 0; border-bottom:1px solid var(--line);}
  .emp-row:last-child{border-bottom:none;}
  .emp-top{display:flex; align-items:center; justify-content:space-between; gap:.8rem; flex-wrap:wrap;}
  .emp-left{display:flex; align-items:center; gap:.7rem;}
  .emp-name{font-weight:700;}
  .emp-actions{display:flex; gap:.5rem; align-items:center;}
  .switch{position:relative; width:40px; height:23px; border-radius:999px; background:var(--line); border:none; cursor:pointer; flex-shrink:0;}
  .switch::after{content:''; position:absolute; top:2px; left:2px; width:19px; height:19px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.3); transition:left .15s ease;}
  .switch.on{background:var(--good);}
  .switch.on::after{left:19px;}
  .loc-row{display:flex; align-items:center; gap:.6rem; padding-left:50px; flex-wrap:wrap;}
  .loc-row > span{font-size:.74rem; color:var(--slate); font-weight:700; text-transform:uppercase; letter-spacing:.03em;}
  .loc-toggle-sm{display:flex; gap:.35rem;}
  .loc-toggle-sm button{
    padding:.32rem .65rem; border-radius:999px; border:1px solid var(--line); background:var(--surface-muted);
    font-size:.76rem; font-weight:700; color:var(--slate); cursor:pointer; display:flex; align-items:center; gap:.32rem;
  }
  .loc-toggle-sm button.active{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-strong);}
  .loc-toggle{display:flex; gap:.5rem;}
  .loc-toggle button{
    padding:.6rem .95rem; border-radius:10px; border:1px solid var(--line); background:var(--surface-muted);
    font-size:.85rem; font-weight:700; color:var(--slate); cursor:pointer; display:flex; align-items:center; gap:.4rem;
  }
  .loc-toggle button.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .add-emp-form{display:flex; gap:.7rem; flex-wrap:wrap; align-items:center;}
  .add-emp-form input{flex:1; min-width:180px;}

  .filter-bar{display:flex; gap:.7rem; flex-wrap:wrap; align-items:flex-end;}
  table{width:100%; border-collapse:collapse; font-size:.86rem;}
  thead th{text-align:left; font-size:.7rem; text-transform:uppercase; letter-spacing:.04em; color:var(--slate); border-bottom:1px solid var(--line); padding:.6rem .6rem;}
  tbody td{padding:.6rem; border-bottom:1px solid var(--line);}
  tbody tr:last-child td{border-bottom:none;}
  .table-wrap{overflow-x:auto;}
  .num{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  .inline-confirm{display:flex; gap:.4rem; align-items:center; font-size:.82rem; color:var(--slate); flex-wrap:wrap;}

  /* ---------- v2: sign-in / employee "My Time" / task tracking ---------- */
  .center-wrap{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:2.2rem 1.4rem 6rem;
    background:
      radial-gradient(900px circle at 15% -10%, var(--accent-soft), transparent 60%),
      radial-gradient(700px circle at 100% 0%, var(--good-soft), transparent 55%),
      var(--surface-muted);
  }
  .center-wrap .brand-card{margin-bottom:1.2rem;}
  .center-head{text-align:center; color:var(--ink); margin-bottom:1.6rem;}
  .center-head h1{font-size:1.5rem; font-weight:800;}
  .center-head p{color:var(--slate); font-size:.9rem; margin-top:.3rem; font-weight:500;}
  .simple-shell{width:100%; max-width:760px;}
  .simple-topbar{display:flex; justify-content:space-between; align-items:center; width:100%; max-width:760px; margin-bottom:1.3rem;}
  .simple-topbar .who b{display:block; font-size:.98rem; font-weight:800; color:var(--ink);}
  .simple-topbar .who span{display:block; font-size:.76rem; color:var(--slate);}
  .admin-gear{position:fixed; right:1.4rem; bottom:1.4rem; z-index:20;}

  .tabs{display:flex; gap:.4rem; background:var(--glass-strong); border-radius:999px; padding:.3rem; margin-bottom:1.3rem; width:100%; max-width:760px;}
  .tab-btn{flex:1; border:none; background:transparent; padding:.6rem 1rem; border-radius:999px; font-weight:700; font-size:.86rem; color:var(--slate); cursor:pointer;}
  .tab-btn.active{background:var(--accent); color:#fff; box-shadow:var(--shadow);}

  .status-card{background:var(--surface); border-radius:22px; box-shadow:var(--shadow); padding:1.6rem; width:100%; text-align:center; display:flex; flex-direction:column; gap:.8rem; align-items:center;}
  .status-card .state-label{font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; font-weight:700; color:var(--slate);}
  .status-card .elapsed{font-family:var(--font-mono); font-size:2.1rem; font-weight:800; color:var(--ink);}
  .status-card .since{font-size:.85rem; color:var(--slate);}
  .clock-btn{width:126px; height:126px; border-radius:50%; border:none; cursor:pointer; font-weight:800; font-size:1.02rem; color:#fff; box-shadow:var(--shadow-lg); transition:transform .12s ease;}
  .clock-btn:active{transform:scale(.97);}
  .clock-btn:disabled{opacity:.6;}
  .clock-btn.in{background:linear-gradient(150deg,var(--accent),var(--accent-strong));}
  .clock-btn.out{background:linear-gradient(150deg,var(--danger),#7E3320);}

  .add-task-form{display:flex; gap:.6rem; flex-wrap:wrap; align-items:flex-end; width:100%;}
  .add-task-form .field{flex:1; min-width:160px;}
  .add-task-form .field.mins{max-width:110px; min-width:90px;}

  .task-list{display:flex; flex-direction:column; gap:.55rem; width:100%;}
  .task-row{display:flex; align-items:center; gap:.7rem; background:var(--surface-muted); border-radius:12px; padding:.6rem .8rem;}
  .task-row .desc{flex:1; font-weight:600; font-size:.88rem;}
  .task-row .mins{font-family:var(--font-mono); font-size:.82rem; color:var(--slate); flex-shrink:0;}
  .task-row .row-actions{display:flex; gap:.3rem; flex-shrink:0;}
  .row-icon-btn{width:28px; height:28px; border-radius:8px; border:none; background:transparent; color:var(--slate-soft); cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .row-icon-btn:hover{background:var(--surface); color:var(--ink);}

  .shift-card{background:var(--surface); border-radius:18px; box-shadow:var(--shadow); padding:1.1rem 1.2rem; width:100%; display:flex; flex-direction:column; gap:.7rem;}
  .shift-card .shift-top{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:.6rem;}
  .shift-card .shift-date{font-weight:800; font-size:.95rem;}
  .shift-card .shift-times{font-family:var(--font-mono); font-size:.8rem; color:var(--slate);}
  .lock-note{display:flex; align-items:center; gap:.35rem; font-size:.76rem; color:var(--slate-soft); font-weight:600;}

  .working-on{font-size:.78rem; color:var(--slate); margin-top:.35rem;}
  .working-on b{color:var(--ink); font-weight:700;}

  .msg-banner{width:100%; max-width:760px; background:var(--danger-soft); color:var(--danger); border-radius:12px; padding:.7rem .9rem; font-size:.85rem; font-weight:600; margin-bottom:1rem;}

  /* ---------- v3: employee "floating crystal" premium view ---------- */
  .center-wrap{
    --surface:rgba(255,255,255,.07);
    --surface-muted:rgba(255,255,255,.045);
    --ink:#F4F7FC;
    --slate:#A7B4C6;
    --slate-soft:#7B8AA0;
    --accent:#63A9EE;
    --accent-strong:#9BCBF5;
    --accent-soft:rgba(99,169,238,.18);
    --good:#74D69A;
    --good-soft:rgba(116,214,154,.15);
    --danger:#E8917A;
    --danger-soft:rgba(232,145,122,.16);
    --gold:#EAC978;
    --gold-soft:rgba(234,201,120,.16);
    --line:rgba(255,255,255,.14);
    --glass:rgba(255,255,255,.08);
    --glass-strong:rgba(255,255,255,.13);
    --shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 18px 40px -20px rgba(0,0,0,.65);
    --shadow-lg:0 1px 0 rgba(255,255,255,.08) inset, 0 30px 70px -24px rgba(0,0,0,.7);
    background:
      radial-gradient(1100px circle at 18% -12%, rgba(99,169,238,.30), transparent 55%),
      radial-gradient(900px circle at 100% 4%, rgba(234,201,120,.16), transparent 52%),
      radial-gradient(800px circle at 46% 118%, rgba(116,214,154,.14), transparent 55%),
      linear-gradient(165deg, #050810 0%, #0A1220 48%, #060911 100%);
    position:relative;
  }

  .center-wrap::before{

      radial-gradient(1.5px 1.5px at 12% 22%, rgba(255,255,255,.55) 0, transparent 60%),

      radial-gradient(2px 2px at 34% 68%, rgba(255,255,255,.35) 0, transparent 60%),
      radial-gradient(1.5px 1.5px at 88% 76%, rgba(255,255,255,.3) 0, transparent 60%),

  .center-wrap > *{position:relative; z-index:1;}

  .center-wrap .shift-card, .center-wrap .tabs, .center-wrap .empty-state, .center-wrap .msg-banner{
    background:linear-gradient(160deg, var(--glass-strong), var(--glass));
    backdrop-filter:blur(22px) saturate(160%);
    -webkit-backdrop-filter:blur(22px) saturate(160%);
    border:1px solid var(--line);
  }
  .center-wrap .msg-banner{color:var(--danger); background:linear-gradient(160deg, rgba(232,145,122,.22), rgba(232,145,122,.08));}

    border:none;

    filter:drop-shadow(0 18px 34px rgba(0,0,0,.45));
  }

    background-size: auto, 190% auto;
    background-position: center, 46% 40%;
    background-blend-mode: normal, screen;
  }
  .center-wrap .status-card::before{
    content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none; z-index:0;
    background:linear-gradient(120deg, rgba(255,255,255,.16) 0%, transparent 30%, transparent 70%, rgba(255,255,255,.06) 100%);
  }
  .center-wrap .status-card::after{
    content:''; position:absolute; left:8%; right:8%; top:-30%; height:60%; border-radius:50%; z-index:0;
    background:radial-gradient(closest-side, rgba(255,255,255,.14), transparent 70%); pointer-events:none;
  }
  .center-wrap .status-card > *{position:relative; z-index:1;}
  @keyframes crystalFloat{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-7px);} }

  .center-wrap .state-label{color:var(--slate-soft); letter-spacing:.1em;}
  .center-wrap .elapsed{color:var(--ink); text-shadow:0 0 24px rgba(99,169,238,.35);}
  .center-wrap .since{color:var(--slate);}

  .center-wrap .clock-btn{position:relative; box-shadow:0 0 0 1px rgba(255,255,255,.12) inset, var(--shadow-lg);}
  .center-wrap .clock-btn.in{background:radial-gradient(circle at 32% 28%, #7FC0F5, var(--accent) 55%, var(--accent-strong) 100%);}
  .center-wrap .clock-btn.out{background:radial-gradient(circle at 32% 28%, #F0A98D, var(--danger) 55%, #7E3320 100%);}
  .center-wrap .clock-btn::after{
    content:''; position:absolute; inset:-11px; border-radius:50%; z-index:-1;
    background:radial-gradient(circle, rgba(99,169,238,.38), transparent 70%);
    animation:haloPulse 3.2s ease-in-out infinite;
  }
  .center-wrap .clock-btn.out::after{background:radial-gradient(circle, rgba(228,120,90,.38), transparent 70%);}
  @keyframes haloPulse{ 0%,100%{opacity:.55; transform:scale(1);} 50%{opacity:1; transform:scale(1.14);} }

  .center-wrap .stat-tile{border-radius:18px; transition:transform .18s ease, border-color .18s ease;}
  .center-wrap .stat-tile:hover{transform:translateY(-3px); border-color:var(--gold-soft);}
  .center-wrap .stat-tile .n{color:var(--ink);}
  .center-wrap .stat-tile .l{color:var(--slate-soft);}

  .center-wrap .tabs{background:var(--glass);}
  .center-wrap .tab-btn{color:var(--slate);}
  .center-wrap .tab-btn.active{background:linear-gradient(135deg, var(--accent), var(--accent-strong)); color:#06101C; box-shadow:0 8px 20px -8px rgba(99,169,238,.6);}

  .center-wrap .center-head h1{color:var(--ink);}
  .center-wrap .center-head p{color:var(--slate);}
  .center-wrap .accent-rule{background:var(--gold); box-shadow:0 0 12px var(--gold-soft);}
  .center-wrap .simple-topbar .who b{color:var(--ink);}
  .center-wrap .simple-topbar .who span{color:var(--slate);}
  .center-wrap .btn-ghost{color:var(--slate);}
  .center-wrap .btn-ghost:hover{color:var(--ink); background:var(--glass);}
  .center-wrap .btn{background:var(--glass); border-color:var(--line); color:var(--ink);}
  .center-wrap .btn:hover{border-color:var(--accent);}
  .center-wrap .btn-primary{background:linear-gradient(135deg, var(--accent), var(--accent-strong)); border-color:var(--accent); color:#06101C; box-shadow:0 8px 20px -8px rgba(99,169,238,.55);}
  .center-wrap .field input{background:var(--surface-muted); border-color:var(--line); color:var(--ink);}
  .center-wrap .field input::placeholder{color:var(--slate-soft);}
  .center-wrap .field label{color:var(--slate);}
  .center-wrap .task-row{border:1px solid var(--line);}
  .center-wrap .lock-note{color:var(--slate-soft);}
  .center-wrap .admin-gear .icon-btn{background:var(--glass-strong); color:var(--ink); border:1px solid var(--line); backdrop-filter:blur(14px);}

  @media (prefers-reduced-motion: reduce){
    .center-wrap .status-card{animation:none;}
    .center-wrap .clock-btn::after{animation:none;}
  }

  @media (max-width: 760px){
    #sidebar{position:fixed; z-index:40; height:100vh; transform:translateX(-100%); transition:transform .2s ease;}
    #sidebar.open{transform:translateX(0);}
    .page-head{flex-direction:column;}
  }
</style>

  function runServer(fnName, args){
    return fetch(API_URL, {
      method: 'POST',
      // text/plain avoids a CORS preflight against Apps Script (which can't answer one);
      // the body is still JSON — the server just reads it as raw text and parses it.
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: fnName, args: args || [] })
    })
    .then(function(res){
      if(!res.ok) throw new Error('Network error (' + res.status + ')');
      return res.json();
    })
    .then(function(data){
      if(!data || data.ok !== true) throw new Error((data && data.error) || 'Server error');
      return data.result;
    });
  }

  /* ================= helpers ================= */
  function pad2(n){ return String(n).padStart(2,'0'); }
  function dateKey(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  function formatTime(d){
    let h=d.getHours(), m=pad2(d.getMinutes());
    const ap = h>=12?'PM':'AM'; h=h%12; if(h===0) h=12;
    return h+':'+m+' '+ap;
  }
  function formatDateShort(dkey){ return new Date(dkey+'T00:00:00').toLocaleDateString(undefined,{ weekday:'short', day:'numeric', month:'short' }); }
  function hoursText(ms){
    if(ms==null) return '—';
    const totalMin = Math.round(ms/60000); const h=Math.floor(totalMin/60), m=totalMin%60;
    return h+'h '+pad2(m)+'m';
  }
  function csvEscape(v){ v=String(v==null?'':v); if(/[",\n]/.test(v)) return '"'+v.replace(/"/g,'""')+'"'; return v; }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function toLocalInputValue(ts){
    var d = new Date(ts);
    var off = d.getTimezoneOffset();
    var local = new Date(d.getTime()-off*60000);
    return local.toISOString().slice(0,16);
  }
  function elapsedText(clockInTs){
    var mins = Math.max(0, Math.floor((Date.now()-clockInTs)/60000));
    var h=Math.floor(mins/60), m=mins%60;
    return h+'h '+pad2(m)+'m';
  }
  function downloadCsv(rows, filename){
    var csv = rows.map(function(r){ return r.map(csvEscape).join(','); }).join('\n');
    var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  }

    trash:'<path d="M4 7h16"/><path d="M9 7V4.8A1.3 1.3 0 0 1 10.3 3.5h3.4A1.3 1.3 0 0 1 15 4.8V7"/><path d="M6 7l1 12.5A1.8 1.8 0 0 0 8.8 21h6.4a1.8 1.8 0 0 0 1.8-1.5L18 7"/><path d="M10 11v6M14 11v6"/>',
    pencil:'<path d="M4 20.5l1-3.6L15.5 6.4a1.8 1.8 0 0 1 2.5 0l1.6 1.6a1.8 1.8 0 0 1 0 2.5L9.1 20l-3.6 1z"/><path d="M14 8l2 2"/>',
    logout:'<path d="M9 21H5.5A1.5 1.5 0 0 1 4 19.5v-15A1.5 1.5 0 0 1 5.5 3H9"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>',
    arrowLeft:'<path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/>',

  function icon(name, size){
    size = size || 20;
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+ICON[name]+'</svg>';
  }

  /* ================= state ================= */
  var state = {
    mode:null, // 'signin' | 'employee' | 'admin'
    signinNotice:'', signinStep:'username', signinUsername:'', signinEmp:null, signinError:'', signinBusy:false,

    empToken:null, myStatus:null, mySummary:null, myHistory:null,
    myTab:'today', editingTaskId:null, editingShiftId:null,

    adminToken:null, adminPage:'dashboard',
    adminOverview:[], adminOverviewLoading:true,
    teamRows:[], newEmpLocation:'onsite',
    empDeleteConfirmId:null, pwResetConfirmId:null, editingUsernameId:null,
    logsFrom:dateKey(new Date(new Date().setDate(new Date().getDate()-13))),
    logsTo:dateKey(new Date()), logsEmployee:'all', logsRows:[],
    reportsFrom:dateKey(new Date(new Date().setDate(new Date().getDate()-13))),
    reportsTo:dateKey(new Date()), reportsAgg:[],
    settingsMsg:''
  };

  var root = document.getElementById('root');

  /* ================= session storage ================= */
  function getSavedEmp(){ try{ var raw=localStorage.getItem(LS_EMP); return raw?JSON.parse(raw):null; }catch(e){ return null; } }
  function getSavedAdmin(){ try{ var raw=localStorage.getItem(LS_ADMIN); return raw?JSON.parse(raw):null; }catch(e){ return null; } }
  function saveEmpSession(token){ state.empToken=token; try{ localStorage.setItem(LS_EMP, JSON.stringify({token:token})); }catch(e){} }
  function clearEmpSession(){ state.empToken=null; state.myStatus=null; state.mySummary=null; state.myHistory=null; try{ localStorage.removeItem(LS_EMP); }catch(e){} }
  function saveAdminSession(token){ state.adminToken=token; try{ localStorage.setItem(LS_ADMIN, JSON.stringify({token:token})); }catch(e){} }
  function clearAdminSession(){ state.adminToken=null; try{ localStorage.removeItem(LS_ADMIN); }catch(e){} }

  function handleAuthError(err, which){
    var msg = (err && err.message) || '';
    if(/sign in/i.test(msg)){
      if(which==='employee'){ clearEmpSession(); stopEmployeeTicker(); state.mode='signin'; state.signinNotice='Your session expired — please sign in again.'; render(); }
      else { clearAdminSession(); stopAdminPoll(); state.mode='signin'; state.signinNotice='Your admin session expired — please sign in again.'; render(); }
    }
  }

  /* ================= router ================= */
  function render(){
    if(state.mode==='employee') return renderEmployee();
    if(state.mode==='admin') return renderAdmin();
    return renderSignin();
  }

  /* ================= SIGN-IN (username + password, no roster shown) ================= */
  function renderSignin(){
    var html = '<div class="center-wrap signin-view">';
    if(state.signinNotice){ html += '<div class="msg-banner">'+escapeHtml(state.signinNotice)+'</div>'; }
    html += '<div class="brand-card"><img src="'+BRAND_LOGO+'" alt="FincSol"></div>';
    html += '<div class="center-head"><h1>Fincsol Time Clock</h1><p>'+(state.signinStep==='username' ? 'Sign in with your username' : (state.signinEmp.hasPassword ? 'Welcome back, '+escapeHtml(state.signinEmp.name) : 'Create your password, '+escapeHtml(state.signinEmp.name)))+'</p></div>';
    html += '<div class="panel" style="max-width:380px; width:100%;">';
    if(state.signinStep==='username'){
      html += '<form id="usernameForm" style="display:flex; flex-direction:column; gap:.9rem;">'+
        '<div class="field"><label>Username</label><input type="text" id="siUsername" autocapitalize="off" autocorrect="off" spellcheck="false" value="'+escapeHtml(state.signinUsername)+'" required autofocus></div>'+
        '<div class="field-error" id="siErr">'+escapeHtml(state.signinError)+'</div>'+
        '<button class="btn btn-primary btn-block" type="submit" id="siContinueBtn">Continue</button>'+
      '</form>';
    } else {
      var creating = !state.signinEmp.hasPassword;
      html += (creating? '<div style="color:var(--slate); font-size:.85rem; margin-bottom:.2rem;">First time signing in — choose a password (6+ characters) you\'ll use every time you clock in or out.</div>':'')+
        '<form id="passwordForm" style="display:flex; flex-direction:column; gap:.9rem;">'+
        '<div class="field"><label>Password</label><input type="password" id="siPw1" minlength="6" required autofocus></div>'+
        (creating? '<div class="field"><label>Confirm password</label><input type="password" id="siPw2" minlength="6" required></div>' : '')+
        '<div class="field-error" id="siErr">'+escapeHtml(state.signinError)+'</div>'+
        '<div style="display:flex; gap:.6rem;"><button type="button" class="btn" id="siBack" style="flex:1;">Back</button><button type="submit" class="btn btn-primary" style="flex:1;">'+(creating?'Create & sign in':'Sign in')+'</button></div>'+
        '</form>';
    }
    html += '</div></div>';
    html += '<button class="icon-btn admin-gear" id="adminGearBtn" title="Admin">'+icon('gear',20)+'</button>';
    root.innerHTML = html;
    state.signinNotice = '';
    var gearBtn = document.getElementById('adminGearBtn');
    if(gearBtn) gearBtn.addEventListener('click', openAdminLoginModal);
    var usernameForm = document.getElementById('usernameForm');
    if(usernameForm) usernameForm.addEventListener('submit', async function(e){
      e.preventDefault();
      var username = document.getElementById('siUsername').value.trim();
      state.signinUsername = username;
      var errEl = document.getElementById('siErr'); errEl.textContent='';
      var btn = document.getElementById('siContinueBtn'); btn.disabled=true;
      try{
        var emp = await runServer('findEmployeeByUsername',[username]);
        state.signinEmp = emp; state.signinStep='password'; state.signinError='';
        render();
      } catch(err){
        btn.disabled=false;
        state.signinError = (err && err.message) ? err.message : 'Something went wrong, try again.';
        render();
      }
    });
    var passwordForm = document.getElementById('passwordForm');
    if(passwordForm) passwordForm.addEventListener('submit', async function(e){
      e.preventDefault();
      var emp = state.signinEmp;
      var creating = !emp.hasPassword;
      var pw1 = document.getElementById('siPw1').value;
      var errEl = document.getElementById('siErr'); errEl.textContent='';
      if(creating){
        var pw2 = document.getElementById('siPw2').value;
        if(pw1!==pw2){ errEl.textContent='Passwords do not match'; return; }
      }
      var btn = e.target.querySelector('button[type=submit]'); btn.disabled=true;
      try{
        var res = creating ? await runServer('createPassword',[emp.id, pw1]) : await runServer('login',[emp.id, pw1]);
        saveEmpSession(res.token);
        state.signinStep='username'; state.signinUsername=''; state.signinEmp=null; state.signinError='';
        state.mode='employee'; state.myTab='today';
        await refreshMyStatus(); await refreshMySummary();
        render(); startEmployeeTicker();
      } catch(err){
        btn.disabled=false;
        if(err && err.message==='NO_PASSWORD'){ state.signinError='No password set yet — go back and try again.'; }
        else state.signinError = (err && err.message) ? err.message : 'Something went wrong, try again.';
        render();
      }
    });
    var backBtn = document.getElementById('siBack');
    if(backBtn) backBtn.addEventListener('click', function(){ state.signinStep='username'; state.signinEmp=null; state.signinError=''; render(); });
  }
  async function openAdminLoginModal(){
    var overlay = document.createElement('div');
    overlay.className='overlay'; overlay.id='adminOverlay';
    overlay.innerHTML = '<div class="card-modal"><h2 style="font-size:1.2rem; font-weight:800;">Loading…</h2></div>';
    document.body.appendChild(overlay);
    var box = overlay.querySelector('.card-modal');
    var passwordSet=null;
    try{ passwordSet = await runServer('isAdminPasswordSet',[]); } catch(e){ passwordSet=null; }
    if(passwordSet===null){
      box.innerHTML = '<h2 style="font-size:1.2rem;font-weight:800;">Can\'t reach the spreadsheet</h2><div style="color:var(--slate); font-size:.88rem;">Check your connection and try again.</div><button class="btn" id="adClose" style="margin-top:.4rem;">Close</button>';
      document.getElementById('adClose').addEventListener('click', function(){ overlay.remove(); });
      return;
    }
    var creating = !passwordSet;
    box.innerHTML = '<h2 style="font-size:1.2rem;font-weight:800;">'+(creating?'Set an admin password':'Admin sign in')+'</h2>'+
      (creating?'<div style="color:var(--slate); font-size:.88rem;">This protects Time Logs, Reports, Team and Settings.</div>':'')+
      '<form id="adForm" style="display:flex; flex-direction:column; gap:.8rem;">'+
      '<div class="field"><label>Password</label><input type="password" id="adPw1" minlength="6" required></div>'+
      (creating? '<div class="field"><label>Confirm password</label><input type="password" id="adPw2" minlength="6" required></div>':'')+
      '<div class="field-error" id="adErr"></div>'+
      '<div style="display:flex; gap:.6rem;"><button type="button" class="btn" id="adCancel" style="flex:1;">Cancel</button><button type="submit" class="btn btn-primary" style="flex:1;">'+(creating?'Set password':'Sign in')+'</button></div>'+
      '</form>';
    document.getElementById('adCancel').addEventListener('click', function(){ overlay.remove(); });
    overlay.addEventListener('click', function(e){ if(e.target===overlay) overlay.remove(); });
    document.getElementById('adForm').addEventListener('submit', async function(e){
      e.preventDefault();
      var pw1=document.getElementById('adPw1').value;
      var errEl=document.getElementById('adErr'); errEl.textContent='';
      if(creating){
        var pw2=document.getElementById('adPw2').value;
        if(pw1!==pw2){ errEl.textContent='Passwords do not match'; return; }
      }
      var btn=e.target.querySelector('button[type=submit]'); btn.disabled=true;
      try{
        if(creating) await runServer('setAdminPassword',[pw1]);
        var token = await runServer('adminLogin',[pw1]);
        saveAdminSession(token);
        overlay.remove();
        await enterAdminMode();
      } catch(err){
        btn.disabled=false;
        errEl.textContent = (err && err.message) ? err.message : 'Something went wrong, try again.';
      }
    });
  }

  /* ================= EMPLOYEE ("My Time") ================= */
  async function refreshMyStatus(){
    try{ state.myStatus = await runServer('getMyStatus',[state.empToken]); }
    catch(err){ handleAuthError(err,'employee'); throw err; }
  }
  async function refreshMySummary(){
    try{ state.mySummary = await runServer('getMySummary',[state.empToken]); } catch(err){ handleAuthError(err,'employee'); }
  }
  async function refreshMyHistory(){
    try{ state.myHistory = await runServer('getMyHistory',[state.empToken, null, null]); } catch(err){ handleAuthError(err,'employee'); }
  }
  function renderEmployee(){
    var emp = state.myStatus.employee;
    var shift = state.myStatus.activeShift;
    var html = '<div class="center-wrap">';
    html += '<div class="simple-topbar"><div class="who"><b>'+escapeHtml(emp.name)+'</b><span>'+(emp.location==='remote'?'Remote':'On-Site')+'</span></div><button class="btn btn-ghost" id="empSignOut">'+icon('logout',16)+' <span style="margin-left:.4rem;">Sign out</span></button></div>';
    html += '<div class="tabs"><button class="tab-btn'+(state.myTab==='today'?' active':'')+'" data-tab="today">Today</button><button class="tab-btn'+(state.myTab==='history'?' active':'')+'" data-tab="history">History</button></div>';
    if(state.myTab==='today') html += renderMyToday(shift);
    else html += '<div class="simple-shell">'+(state.myHistory? renderMyHistory() : '<div class="empty-state">Loading…</div>')+'</div>';
    html += '</div>';
    root.innerHTML = html;
    document.getElementById('empSignOut').addEventListener('click', doEmployeeSignOut);
    root.querySelectorAll('.tab-btn').forEach(function(b){ b.addEventListener('click', async function(){
      state.myTab=b.getAttribute('data-tab');
      if(state.myTab==='history' && !state.myHistory){ await refreshMyHistory(); }
      render();
    }); });
    wireMyEvents();
  }
  function renderMyToday(shift){
    var html = '<div class="simple-shell" style="display:flex; flex-direction:column; gap:1.2rem; align-items:center;">';
    if(shift){
      html += '<div class="status-card"><div class="state-label">Clocked in</div>'+
        '<div class="elapsed" id="elapsedText">'+elapsedText(shift.clockInTs)+'</div>'+
        '<div class="since">since '+formatTime(new Date(shift.clockInTs))+'</div>'+
        '<button class="clock-btn out" id="clockBtn">Clock Out</button></div>';
    } else {
      html += '<div class="status-card"><div class="state-label">Not clocked in</div>'+
        '<button class="clock-btn in" id="clockBtn">Clock In</button></div>';
    }
    html += statRowHtml(state.mySummary);
    if(shift){
      html += '<div class="panel" style="width:100%;"><div class="panel-head"><h2>What are you working on?</h2></div>'+
        '<form class="add-task-form" id="taskForm"><div class="field"><label>Task</label><input type="text" id="taskDesc" placeholder="e.g. Etsy Listing" required></div>'+
        '<div class="field mins"><label>Minutes</label><input type="number" id="taskMins" min="1" max="1440" placeholder="30" required></div>'+
        '<button class="btn btn-primary" type="submit">'+icon('plus',16)+'</button></form>'+
        '<div class="field-error" id="taskErr"></div>';
      var tasks = shift.tasks||[];
      if(tasks.length){
        html += '<div class="task-list">'+tasks.map(function(t){ return taskRowHtml(t, true); }).join('')+'</div>';
      } else {
        html += '<div class="section-empty">No tasks logged yet this shift.</div>';
      }
      html += '</div>';
    }
    html += '</div>';
    return html;
  }
  function statRowHtml(summary){
    summary = summary || {today:0,week:0,month:0};
    return '<div class="stat-row" style="width:100%;">'+
      '<div class="stat-tile"><div class="n">'+hoursText(summary.today*60000)+'</div><div class="l">Today</div></div>'+
      '<div class="stat-tile"><div class="n">'+hoursText(summary.week*60000)+'</div><div class="l">This week</div></div>'+
      '<div class="stat-tile"><div class="n">'+hoursText(summary.month*60000)+'</div><div class="l">This month</div></div>'+
    '</div>';
  }
  function taskRowHtml(t, editable){
    if(state.editingTaskId===t.id){
      return '<div class="task-row"><input type="text" id="editDesc_'+t.id+'" value="'+escapeHtml(t.description)+'" style="flex:1; border:1px solid var(--line); border-radius:8px; padding:.4rem .6rem; background:var(--surface);">'+
        '<input type="number" min="1" max="1440" id="editMins_'+t.id+'" value="'+t.minutes+'" style="width:70px; border:1px solid var(--line); border-radius:8px; padding:.4rem .5rem; background:var(--surface);">'+
        '<div class="row-actions"><button class="row-icon-btn" data-save-task="'+t.id+'">'+icon('check',16)+'</button><button class="row-icon-btn" data-cancel-task="1">'+icon('arrowLeft',16)+'</button></div></div>';
    }
    return '<div class="task-row"><div class="desc">'+escapeHtml(t.description)+'</div><div class="mins">'+t.minutes+' min</div>'+
      (editable? '<div class="row-actions"><button class="row-icon-btn" data-edit-task="'+t.id+'">'+icon('pencil',15)+'</button><button class="row-icon-btn" data-del-task="'+t.id+'">'+icon('trash',15)+'</button></div>' : '<div class="lock-note">'+icon('lock',13)+' Locked</div>')+
    '</div>';
  }
  function renderMyHistory(){
    var shifts = (state.myHistory && state.myHistory.shifts) || [];
    var editableFrom = state.myHistory.editableFromDateKey;
    if(!shifts.length) return '<div class="empty-state">No shifts logged yet.</div>';
    var html = '<div style="display:flex; flex-direction:column; gap:1rem;">';
    shifts.forEach(function(s){
      var editable = s.date >= editableFrom;
      html += '<div class="shift-card"><div class="shift-top"><div><div class="shift-date">'+formatDateShort(s.date)+'</div><div class="shift-times">'+formatTime(new Date(s.clockInTs))+' – '+(s.clockOutTs? formatTime(new Date(s.clockOutTs)) : 'in progress')+'</div></div>';
      if(state.editingShiftId===s.id){
        html += '<div style="display:flex; gap:.6rem; flex-wrap:wrap;">'+
          '<div class="field"><label>Clock in</label><input type="datetime-local" id="shiftIn_'+s.id+'" value="'+toLocalInputValue(s.clockInTs)+'"></div>'+
          '<div class="field"><label>Clock out</label><input type="datetime-local" id="shiftOut_'+s.id+'" value="'+(s.clockOutTs?toLocalInputValue(s.clockOutTs):'')+'"></div>'+
          '<div style="display:flex; gap:.4rem; align-items:flex-end;"><button class="btn btn-primary btn-sm" data-save-shift="'+s.id+'">Save</button><button class="btn btn-ghost btn-sm" data-cancel-shift="1">Cancel</button></div>'+
        '</div>';
      } else {
        html += (editable? '<button class="btn btn-ghost btn-sm" data-edit-shift="'+s.id+'">'+icon('pencil',14)+' <span style="margin-left:.3rem;">Edit times</span></button>' : '<span class="lock-note">'+icon('lock',13)+' Locked (30+ days old)</span>');
      }
      html += '</div>';
      if(s.tasks && s.tasks.length){
        html += '<div class="task-list">'+s.tasks.map(function(t){ return taskRowHtml(t, editable); }).join('')+'</div>';
      }
      html += '</div>';
    });
    html += '</div>';
    return html;
  }
  function wireMyEvents(){
    var clockBtn = document.getElementById('clockBtn');
    if(clockBtn) clockBtn.addEventListener('click', async function(){
      clockBtn.disabled=true;
      try{
        if(state.myStatus.activeShift) state.myStatus = await runServer('clockOut',[state.empToken]);
        else state.myStatus = await runServer('clockIn',[state.empToken]);
        await refreshMySummary();
        if(state.myHistory) await refreshMyHistory();
        render();
      } catch(err){ handleAuthError(err,'employee'); alert((err&&err.message)||'Something went wrong'); clockBtn.disabled=false; }
    });
    var taskForm = document.getElementById('taskForm');
    if(taskForm) taskForm.addEventListener('submit', async function(e){
      e.preventDefault();
      var desc = document.getElementById('taskDesc').value.trim();
      var mins = document.getElementById('taskMins').value;
      var errEl = document.getElementById('taskErr'); errEl.textContent='';
      var btn = taskForm.querySelector('button[type=submit]'); btn.disabled=true;
      try{ state.myStatus = await runServer('addTask',[state.empToken, desc, mins]); render(); }
      catch(err){ btn.disabled=false; errEl.textContent=(err&&err.message)||'Could not add task'; }
    });
    root.querySelectorAll('[data-edit-task]').forEach(function(b){ b.addEventListener('click', function(){ state.editingTaskId=b.getAttribute('data-edit-task'); render(); }); });
    root.querySelectorAll('[data-cancel-task]').forEach(function(b){ b.addEventListener('click', function(){ state.editingTaskId=null; render(); }); });
    root.querySelectorAll('[data-save-task]').forEach(function(b){ b.addEventListener('click', async function(){
      var id = b.getAttribute('data-save-task');
      var desc = document.getElementById('editDesc_'+id).value.trim();
      var mins = document.getElementById('editMins_'+id).value;
      try{
        await runServer('updateTask',[state.empToken, id, desc, mins]);
        state.editingTaskId=null;
        await refreshMyStatus();
        if(state.myHistory) await refreshMyHistory();
        render();
      } catch(err){ handleAuthError(err,'employee'); alert((err&&err.message)||'Could not save'); }
    }); });
    root.querySelectorAll('[data-del-task]').forEach(function(b){ b.addEventListener('click', async function(){
      var id = b.getAttribute('data-del-task');
      if(!confirm('Delete this task?')) return;
      try{
        await runServer('deleteTask',[state.empToken, id]);
        await refreshMyStatus();
        if(state.myHistory) await refreshMyHistory();
        render();
      } catch(err){ handleAuthError(err,'employee'); alert((err&&err.message)||'Could not delete'); }
    }); });
    root.querySelectorAll('[data-edit-shift]').forEach(function(b){ b.addEventListener('click', function(){ state.editingShiftId=b.getAttribute('data-edit-shift'); render(); }); });
    root.querySelectorAll('[data-cancel-shift]').forEach(function(b){ b.addEventListener('click', function(){ state.editingShiftId=null; render(); }); });
    root.querySelectorAll('[data-save-shift]').forEach(function(b){ b.addEventListener('click', async function(){
      var id = b.getAttribute('data-save-shift');
      var inVal = document.getElementById('shiftIn_'+id).value;
      var outVal = document.getElementById('shiftOut_'+id).value;
      try{
        await runServer('updateShiftTimes',[state.empToken, id, inVal?new Date(inVal).toISOString():null, outVal?new Date(outVal).toISOString():null]);
        state.editingShiftId=null;
        await refreshMyHistory();
        render();
      } catch(err){ handleAuthError(err,'employee'); alert((err&&err.message)||'Could not save'); }
    }); });
  }
  var empTickerId=null;
  function startEmployeeTicker(){
    stopEmployeeTicker();
    empTickerId = setInterval(function(){
      if(state.mode==='employee' && state.myTab==='today' && state.myStatus && state.myStatus.activeShift){
        var el = document.getElementById('elapsedText');
        if(el) el.textContent = elapsedText(state.myStatus.activeShift.clockInTs);
      }
    }, 30000);
  }
  function stopEmployeeTicker(){ if(empTickerId){ clearInterval(empTickerId); empTickerId=null; } }
  async function doEmployeeSignOut(){
    var token = state.empToken;
    clearEmpSession(); stopEmployeeTicker();
    state.mode='signin'; render();
    if(token){ try{ runServer('logout',[token]); }catch(e){} }
  }

  /* ================= ADMIN ================= */
  var ADMIN_TITLE = {dashboard:'Dashboard', timelogs:'Time Logs', reports:'Reports', team:'Team', settings:'Settings'};
  var ADMIN_SUB = {
    dashboard:"Who's clocked in right now, and what they're working on",
    timelogs:'Every shift and task, filterable and fully editable',
    reports:'Hours worked across your team',
    team:'Add employees and manage accounts',
    settings:'Admin password'
  };
  async function enterAdminMode(){
    state.mode='admin'; state.adminPage='dashboard';
    await refreshAdminOverview();
    await refreshTeam();
    render();
    startAdminPoll();
  }
  async function refreshAdminOverview(){
    try{ state.adminOverview = await runServer('getAdminOverview',[state.adminToken]); state.adminOverviewLoading=false; }
    catch(err){ handleAuthError(err,'admin'); }
  }
  async function refreshTeam(){
    try{ state.teamRows = await runServer('listEmployeesAdmin',[state.adminToken]); } catch(err){ handleAuthError(err,'admin'); }
  }
  async function refreshLogs(){
    try{ state.logsRows = await runServer('getAllShifts',[state.adminToken, state.logsFrom, state.logsTo, state.logsEmployee]); }
    catch(err){ handleAuthError(err,'admin'); }
  }
  async function refreshReports(){
    try{
      var rows = await runServer('getAllShifts',[state.adminToken, state.reportsFrom, state.reportsTo, 'all']);
      var byEmp = {};
      rows.forEach(function(s){
        var mins = Math.round(((s.clockOutTs||Date.now())-s.clockInTs)/60000);
        if(!byEmp[s.employeeId]) byEmp[s.employeeId] = {name:s.employeeName, minutes:0};
        byEmp[s.employeeId].minutes += mins;
      });

  function openAdminShiftModal(shift){
    var overlay = document.createElement('div');
    overlay.className='overlay'; overlay.id='admShiftOverlay';
    overlay.innerHTML = '<div class="card-modal" style="text-align:left; max-width:480px;">'+
      '<h2 style="font-size:1.1rem; font-weight:800;">'+escapeHtml(shift.employeeName)+' — '+formatDateShort(shift.date)+'</h2>'+
      '<div style="display:flex; gap:.6rem; flex-wrap:wrap;">'+
        '<div class="field"><label>Clock in</label><input type="datetime-local" id="admIn"></div>'+
        '<div class="field"><label>Clock out</label><input type="datetime-local" id="admOut"></div>'+
      '</div>'+
      '<div class="field-error" id="admShiftErr"></div>'+
      '<div id="admTaskList" class="task-list"></div>'+
      '<div style="display:flex; gap:.6rem;"><button class="btn" id="admShiftCancel" style="flex:1;">Close</button><button class="btn btn-primary" id="admShiftSave" style="flex:1;">Save times</button></div>'+
    '</div>';
    document.body.appendChild(overlay);
    document.getElementById('admIn').value = toLocalInputValue(shift.clockInTs);
    if(shift.clockOutTs) document.getElementById('admOut').value = toLocalInputValue(shift.clockOutTs);
    var taskListEl = document.getElementById('admTaskList');
    function renderAdmTasks(){
      taskListEl.innerHTML = shift.tasks.map(function(t){ return adminTaskRowHtml(t); }).join('') || '<div class="section-empty">No tasks logged.</div>';
      wireAdminTaskRow(shift, renderAdmTasks);
    }
    renderAdmTasks();
    document.getElementById('admShiftCancel').addEventListener('click', function(){ overlay.remove(); });
    overlay.addEventListener('click', function(e){ if(e.target===overlay) overlay.remove(); });
    document.getElementById('admShiftSave').addEventListener('click', async function(){
      var inVal=document.getElementById('admIn').value, outVal=document.getElementById('admOut').value;
      var errEl=document.getElementById('admShiftErr'); errEl.textContent='';
      try{
        await runServer('adminUpdateShift',[state.adminToken, shift.id, inVal?new Date(inVal).toISOString():null, outVal?new Date(outVal).toISOString():null]);
        overlay.remove();
        await refreshLogs(); render();
      } catch(err){ handleAuthError(err,'admin'); errEl.textContent=(err&&err.message)||'Could not save'; }
    });
  }
  function adminTaskRowHtml(t){
    if(state.editingTaskId===t.id){
      return '<div class="task-row"><input type="text" id="admEditDesc_'+t.id+'" value="'+escapeHtml(t.description)+'" style="flex:1; border:1px solid var(--line); border-radius:8px; padding:.4rem .6rem; background:var(--surface);">'+
        '<input type="number" id="admEditMins_'+t.id+'" value="'+t.minutes+'" style="width:70px; border:1px solid var(--line); border-radius:8px; padding:.4rem .5rem; background:var(--surface);">'+
        '<div class="row-actions"><button class="row-icon-btn" data-adm-save-task="'+t.id+'">'+icon('check',16)+'</button><button class="row-icon-btn" data-adm-cancel-task="1">'+icon('arrowLeft',16)+'</button></div></div>';
    }
    return '<div class="task-row"><div class="desc">'+escapeHtml(t.description)+'</div><div class="mins">'+t.minutes+' min</div>'+
      '<div class="row-actions"><button class="row-icon-btn" data-adm-edit-task="'+t.id+'">'+icon('pencil',15)+'</button><button class="row-icon-btn" data-adm-del-task="'+t.id+'">'+icon('trash',15)+'</button></div></div>';

  function wireAdminTaskRow(shift, rerender){
    document.querySelectorAll('[data-adm-edit-task]').forEach(function(b){ b.addEventListener('click', function(){ state.editingTaskId=b.getAttribute('data-adm-edit-task'); rerender(); }); });
    document.querySelectorAll('[data-adm-cancel-task]').forEach(function(b){ b.addEventListener('click', function(){ state.editingTaskId=null; rerender(); }); });
    document.querySelectorAll('[data-adm-save-task]').forEach(function(b){ b.addEventListener('click', async function(){
      var id=b.getAttribute('data-adm-save-task');
      var desc=document.getElementById('admEditDesc_'+id).value.trim();
      var mins=document.getElementById('admEditMins_'+id).value;
      try{
        await runServer('adminUpdateTask',[state.adminToken, id, desc, mins]);
        var t = shift.tasks.find(function(x){return x.id===id;}); if(t){ t.description=desc; t.minutes=Number(mins); }
        state.editingTaskId=null; rerender();
        await refreshLogs();
      } catch(err){ handleAuthError(err,'admin'); alert((err&&err.message)||'Could not save'); }
    }); });
    document.querySelectorAll('[data-adm-del-task]').forEach(function(b){ b.addEventListener('click', async function(){
      var id=b.getAttribute('data-adm-del-task');
      if(!confirm('Delete this task?')) return;
      try{
        await runServer('adminDeleteTask',[state.adminToken, id]);
        shift.tasks = shift.tasks.filter(function(x){return x.id!==id;});
        rerender();
        await refreshLogs();
      } catch(err){ handleAuthError(err,'admin'); alert((err&&err.message)||'Could not delete'); }
    }); });
  }
  function exportLogsCsv(){
    var rows=[['Employee','Date','Clock In','Clock Out','Hours','Task','Task Minutes']];
    state.logsRows.forEach(function(s){
      var mins = Math.round(((s.clockOutTs||Date.now())-s.clockInTs)/60000);
      if(s.tasks.length){
        s.tasks.forEach(function(t){ rows.push([s.employeeName, s.date, formatTime(new Date(s.clockInTs)), s.clockOutTs?formatTime(new Date(s.clockOutTs)):'', hoursText(mins*60000), t.description, t.minutes]); });
      } else {
        rows.push([s.employeeName, s.date, formatTime(new Date(s.clockInTs)), s.clockOutTs?formatTime(new Date(s.clockOutTs)):'', hoursText(mins*60000), '', '']);
      }
    });
    downloadCsv(rows, 'fincsol-time-logs.csv');
  }
  function exportReportsCsv(){
    var rows=[['Employee','Total Hours']];
    (state.reportsAgg||[]).forEach(function(a){ rows.push([a.name, hoursText(a.minutes*60000)]); });
    downloadCsv(rows, 'fincsol-reports.csv');
  }

        var errEl=document.getElementById('chAdminPwErr'); errEl.textContent=''; state.settingsMsg='';
        if(n1!==n2){ errEl.textContent='New passwords do not match'; return; }
        try{ await runServer('changeAdminPassword',[state.adminToken, cur, n1]); state.settingsMsg='Password updated.'; render(); }
        catch(err){ handleAuthError(err,'admin'); errEl.textContent=(err&&err.message)||'Could not update password'; }
      });
    }
  }
  async function doAdminSignOut(){
    var token = state.adminToken;
    clearAdminSession(); stopAdminPoll();
    state.mode='signin'; render();
    if(token){ try{ runServer('adminLogout',[token]); }catch(e){} }
  }

  /* ================= boot ================= */
  async function boot(){
    var savedEmp = getSavedEmp();
    if(savedEmp && savedEmp.token){
      state.empToken = savedEmp.token;
      try{
        await refreshMyStatus(); await refreshMySummary();
        state.mode='employee'; state.myTab='today'; render(); startEmployeeTicker(); return;
      } catch(e){ clearEmpSession(); }
    }
    var savedAdmin = getSavedAdmin();
    if(savedAdmin && savedAdmin.token){
      state.adminToken = savedAdmin.token;
      try{
        await refreshAdminOverview(); await refreshTeam();
        state.mode='admin'; state.adminPage='dashboard'; render(); startAdminPoll(); return;
      } catch(e){ clearAdminSession(); }
    }
    state.mode='signin';
    render();
  }
  boot();

  // Register the service worker so Chrome/Edge offer the install prompt and the app shell
  // still loads (with a "you're offline" state for data) if the connection drops.
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(err){
        console.warn('Service worker registration failed:', err);
      });
    });
  }
})();
</script>
</body>
</html>
